# This sentinel is a reminder to choose a real run name.
run_name: 'krea2_turbo_test_run'

metrics_file: "" # for testing, local file that stores scalar metrics. If empty, no metrics are written.
# If true save metrics such as loss and TFLOPS to GCS in {base_output_directory}/{run_name}/metrics/
write_metrics: True

timing_metrics_file: "" # for testing, local file that stores function timing metrics such as state creation, compilation. If empty, no metrics are written.
write_timing_metrics: True

gcs_metrics: False
# If true save config to GCS in {base_output_directory}/{run_name}/
save_config_to_gcs: False
log_period: 100

pretrained_model_name_or_path: 'krea/Krea-2-Turbo'

# Krea 2 params
use_latents: False
latents_path: ""
max_sequence_length: 512
# Resolution-aware exponential timestep shift (base/midtrain checkpoint).
# The distilled Turbo checkpoint sets is_distilled: True and uses a fixed mu=1.15.
is_distilled: True
base_shift: 0.5
max_shift: 1.15
base_image_seq_len: 256
max_image_seq_len: 6400


unet_checkpoint: ''
revision: ''
# This will convert the weights to this dtype.
# When running inference on TPUv5e, use weights_dtype: 'bfloat16'
weights_dtype: 'bfloat16'
# This sets the layer's dtype in the model. Ex: nn.Dense(dtype=activations_dtype)
activations_dtype: 'bfloat16'

# matmul and conv precision from https://jax.readthedocs.io/en/latest/jax.lax.html#jax.lax.Precision
# Options are "DEFAULT", "HIGH", "HIGHEST"
# fp32 activations and fp32 weights with HIGHEST will provide the best precision
# at the cost of time.
precision: "DEFAULT"

# if False state is not jitted and instead replicate is called. This is good for debugging on single host
# It must be True for multi-host.
jit_initializers: True

# Set true to load weights from pytorch
from_pt: True
split_head_dim: True
attention: 'flash' # Supported attention: dot_product, flash, cudnn_flash_te
# If mask_padding_tokens is True, we pass in segment ids to splash attention to avoid attending to padding tokens.
# Else we do not pass in segment ids and on vpu bound hardware like trillium this is faster.
# However, when padding tokens are significant, this will lead to worse quality and should be set to True.
mask_padding_tokens: True
# Maxdiffusion has 2 types of attention sharding strategies:
# 1. attention_sharding_uniform = True : same sequence sharding rules applied for q in both (self and cross attention)
# 2. attention_sharding_uniform = False : Heads are sharded uniformly across devices for self attention while sequence is sharded
#    in cross attention q.
attention_sharding_uniform: True

flash_block_sizes: {}
# GroupNorm groups
norm_num_groups: 32

# If train_new_flux, flux weights will be randomly initialized to train flux from scratch
# else they will be loaded from pretrained_model_name_or_path
train_new_flux: False

# train text_encoder - Currently not supported for SDXL
train_text_encoder: False
text_encoder_learning_rate: 4.25e-6

# https://arxiv.org/pdf/2305.08891.pdf
snr_gamma: -1.0

timestep_bias: {
  # a value of later will increase the frequence of the model's final training steps.
  # none, earlier, later, range
  strategy: "none",
  # multiplier for bias, a value of 2.0 will double the weight of the bias, 0.5 will halve it.
  multiplier: 1.0,
  # when using strategy=range, the beginning (inclusive) timestep to bias.
  begin: 0,
  # when using strategy=range, the final step (inclusive) to bias.
  end: 1000,
  # portion of timesteps to bias.
  # 0.5 will bias one half of the timesteps. Value of strategy determines
  # whether the biased portions are in the earlier or later timesteps.
  portion: 0.25
}

# Override parameters from checkpoints's scheduler.
diffusion_scheduler_config: {
  _class_name: 'FlaxEulerDiscreteScheduler',
  prediction_type: 'epsilon',
  rescale_zero_terminal_snr: False,
  timestep_spacing: 'trailing'
}

# Output directory
# Create a GCS bucket, e.g. my-maxtext-outputs and set this to "gs://my-maxtext-outputs/"
base_output_directory: ""

# Hardware
hardware: 'tpu' # Supported hardware types are 'tpu', 'gpu'
skip_jax_distributed_system: False

# Parallelism
mesh_axes: ['data', 'fsdp', 'context', 'tensor']

# batch : batch dimension of data and activations
# hidden :
# embed : attention qkv dense layer hidden dim named as embed
# heads : attention head dim = num_heads * head_dim
# length : attention sequence length
# temb_in : dense.shape[0] of resnet dense before conv
# out_c : dense.shape[1] of resnet dense before conv
# out_channels : conv.shape[-1] activation
# keep_1 : conv.shape[0] weight
# keep_2 : conv.shape[1] weight
# conv_in : conv.shape[2] weight
# conv_out : conv.shape[-1] weight
logical_axis_rules: [
                      ['batch', 'data'],
                      ['activation_batch', ['data','fsdp']],
                      ['activation_heads', 'tensor'],
                      ['activation_kv', 'tensor'],
                      ['mlp','tensor'],
                      ['embed','fsdp'],
                      ['heads', 'tensor'],
                      ['conv_batch', ['data','fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'fsdp'],
                    ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

# One axis for each parallelism type may hold a placeholder (-1)
# value to auto-shard based on available slices and devices.
# By default, product of the DCN axes should equal number of slices
# and product of the ICI axes should equal number of devices per slice.
dcn_data_parallelism: 1  # recommended DCN axis to be auto-sharded
dcn_fsdp_parallelism: -1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: -1
ici_context_parallelism: 1
ici_tensor_parallelism: 1

allow_split_physical_axes: False

# Dataset
# Replace with dataset path or train_data_dir. One has to be set.
dataset_name: 'diffusers/pokemon-gpt4-captions'
train_split: 'train'
dataset_type: 'tfrecord'  # Options: 'tfrecord', 'hf', 'tf', 'grain', 'synthetic'
cache_latents_text_encoder_outputs: True
dataset_save_location: '/tmp/pokemon-gpt4-captions_xl'
train_data_dir: ''
dataset_config_name: ''
jax_cache_dir: ''
# Serialize per-shape TPU executables so later processes can skip tracing and
# lowering. Keep this on persistent storage for serving.
aot_cache_dir: ''
# Host cache of the final quantized weight trees (int8 transformer and text encoder, plus the host embedding
# table). A run that misses saves them, later runs read them instead of reading and re-quantizing the
# checkpoint. Only quantized components are cached; any LoRA adapter bypasses the transformer cache. Needs
# ~17 GiB for the v6e-1 preset. Empty means off.
krea2_weight_cache_dir: ''
# Only build krea2_weight_cache_dir: read and quantize the checkpoint on the host, save the components whose
# cache is missing (complete ones are not read) and exit without generating an image. Needs no accelerator
# (e.g. a CPU VM with JAX_PLATFORMS=cpu plus skip_jax_distributed_system=True, as a machine without a TPU
# has no JAX distributed coordinator); excludes krea2_precompile.
krea2_weight_cache_build_only: False
# Cold start: seconds each weight cache component waits for its directory (its meta.json) to appear before
# the normal load, for a cache still being pulled while the process starts (polls every 1 s; the timeout
# falls through to the normal miss handling). 0 means off.
krea2_weight_cache_wait_s: 0
# Load a cached executable when its shape is first called instead of all of them at startup. Use it
# when the cache holds many shapes (e.g. after krea2_precompile) and a run needs only a few.
aot_cache_lazy_load: False
# gs://<bucket>[/<prefix>] holding the aot_cache_dir executables: a lazily loaded executable missing in
# aot_cache_dir is first downloaded from <prefix>/<file name> (crc32c-checked); a missing object compiles as
# before. Needs aot_cache_dir and aot_cache_lazy_load. Not part of the executables' key. Empty means off.
aot_cache_gcs: ''
# Overlap the independent Transformer/Qwen host reads with VAE loading.
parallel_component_loading: True
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
resolution: 512
center_crop: False
random_flip: False
tokenize_captions_num_proc: 4
transform_images_num_proc: 4
reuse_example_batch: False
enable_data_shuffling: True

# checkpoint every number of samples, -1 means don't checkpoint.
checkpoint_every: -1
# enables one replica to read the ckpt then broadcast to the rest
enable_single_replica_ckpt_restoring: False

# Training loop
learning_rate: 1.e-5
scale_lr: False
max_train_samples: -1
# max_train_steps takes priority over num_train_epochs.
max_train_steps: 1500
num_train_epochs: 1
seed: 0
output_dir: 'output/'
output_name: "krea2_turbo_generated_image.png"
per_device_batch_size: 1

warmup_steps_fraction: 0.1
learning_rate_schedule_steps: -1 # By default the length of the schedule is set to the number of steps.

# AdamW optimizer parameters
adam_b1: 0.9 # Exponential decay rate to track the first moment of past gradients.
adam_b2: 0.999 # Exponential decay rate to track the second moment of past gradients.
adam_eps: 1.e-8 # A small constant applied to denominator outside of the square root.
adam_weight_decay: 0 # AdamW Weight decay
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: False
max_grad_norm: 1.0

enable_profiler: False
skip_first_n_steps_for_profiler: 5
profiler_steps: 10
profiler: ""

# Generation parameters
prompt: "a fox in the snow"
# Optional UTF-8 file with one prompt per non-empty line. When set, this
# replaces `prompt` and must resolve to the configured batch size.
prompt_file: ""
prompt_2: ""
negative_prompt: ""
do_classifier_free_guidance: False
# Krea 2 guidance convention: velocity = cond + guidance_scale * (cond - uncond);
# The distilled Turbo checkpoint runs 8 steps with guidance explicitly disabled
# (see the krea/Krea-2-Turbo model card).
guidance_scale: 0.0
guidance_rescale: 0.0
num_inference_steps: 8
save_final_checkpoint: False

# SDXL Lightning parameters
lightning_from_pt: True
lightning_repo: ""
lightning_ckpt: ""

# LoRA parameters
# Applies externally-trained LoRA adapters (.safetensors) to the Krea 2
# transformer at inference. Supported key formats: kohya/ComfyUI
# (lora_down/lora_up + alpha, plus diff/diff_b) and diffusers/PEFT
# (lora_A/lora_B). Text-encoder LoRA keys are ignored with a warning.
# Each list entry describes one adapter:
#   lora_model_name_or_path: local .safetensors path, local directory, or HF Hub repo id
#   weight_name: file name inside the directory/repo (may repeat the file name for a direct path)
#   adapter_name: unique name for this adapter
#   scale: adapter strength multiplier (1.0 = as trained)
#   from_pt: accepted for config compatibility; LoRA files are always torch-format
# Example:
# lora_config: {
#   lora_model_name_or_path: ["/path/to/my_krea2_lora.safetensors"],
#   weight_name: ["my_krea2_lora.safetensors"],
#   adapter_name: ["my-style"],
#   scale: [0.8],
#   from_pt: ["true"]
# }
lora_config: {
  lora_model_name_or_path: [],
  weight_name: [],
  adapter_name: [],
  scale: [],
  from_pt: []
}

enable_mllog: False

#controlnet
controlnet_model_name_or_path: 'diffusers/controlnet-canny-sdxl-1.0'
controlnet_from_pt: True
controlnet_conditioning_scale: 0.5
controlnet_image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1024px-Google_%22G%22_logo.svg.png'
quantization: ''
quantization_local_shard_count: -1
use_qwix_quantization: False
compile_topology: "" # Target TPU topology for compile_krea2.py AOT memory estimation, e.g. v6e-4.
compile_topology_num_slices: -1 # Number of target slices, set to a positive integer.
compile_hlo_dir: "" # compile_krea2.py only: if set, writes each compiled executable's optimized HLO to <dir>/<executable>.txt.

# ML Diagnostics settings
enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False

# Specific additions for generate_krea2 execution
height: 1024
width: 1024
batch_size: 1
interactive: False
# Compile the repeated DiT block as a reusable executable instead of one
# monolithic 28-block executable. This lowers peak HBM for 2K inference at the
# cost of additional dispatch overhead. LoRA adapters are passed explicitly to
# each staged block.
krea2_staged_transformer: False
# Donate the residual stream between staged DiT blocks so async dispatch does not
# allocate one output buffer per block ahead of execution (saves ~num_layers x
# hidden-state bytes of HBM at 2K). Only affects krea2_staged_transformer=True.
krea2_staged_donate_hidden_states: True
# Components whose weights stay on the host and are placed on device only for
# their phase (text_encoder: prompt encoding, transformer: denoising), then
# freed. Lowers peak HBM at the cost of a host->device transfer per generation.
# Allowed entries: "text_encoder", "transformer".
krea2_offload_components: []
# attention 'flash_custom' only: kernel variant of the Krea 2 Pallas kernel.
# 'auto' (default): 'hybrid' on a TPU v6e, 'flash' on every other chip;
# 'flash' / 'hybrid' force a variant (hybrid needs more VMEM: on v5e its
# automatic block_q is capped lower). '' means 'auto'; other values fail at startup.
krea2_attention_kernel: 'auto'
# Scoped-VMEM limit (KiB) of the executables that run the DiT blocks (the
# monolithic transformer_step or the staged transformer_block; not the text
# encoder, text context or VAE), passed to XLA as the per-program compile option
# xla_tpu_scoped_vmem_limit_kib on a TPU only (never on CPU). 0 = the compiler's
# default (32 MiB on v6e); otherwise an int in [16384, 131072]. A larger limit
# lets fusions use bigger tiles but leaves less of the 128 MiB VMEM to MSA
# placements (see base_krea2_turbo_v6e1.yml). Command-line override:
# krea2_transformer_scoped_vmem_limit_kib=65536.
krea2_transformer_scoped_vmem_limit_kib: 0
# RoPE layout of the DiT blocks: "interleaved" (checkpoint order, rotates
# (2i, 2i+1) pairs) or "rotate_half" (q/k head dims are permuted at load time so
# RoPE rotates the two 64-lane halves; identical outputs, cheaper on TPU).
krea2_rope_layout: 'interleaved'
# If > 0, valid prompt tokens are gathered to the front and the text sequence is
# truncated to the next multiple of this value (e.g. 128) before denoising.
# Exact (text positions are all zero); one step executable per bucket. 0 = off.
krea2_text_compaction_multiple: 0
# Text encoder (Qwen3-VL text tower) weight quantization: '' (off, weights_dtype)
# or 'int8' (qwix weight-only PTQ of the q/k/v/o and gate/up/down projection
# kernels; one scale per krea2_text_encoder_quant_tile_size input rows and output
# column, stored in the compute dtype; norms and the embedding stay unquantized).
# Roughly halves the text encoder's HBM (bf16 ~6.8 GiB -> int8 ~3.4 GiB, excluding the embedding).
krea2_text_encoder_quantization: ''
krea2_text_encoder_quant_tile_size: 128
# Look up prompt token embeddings on the host and pass them to the text encoder
# as inputs_embeds, so the 151936x2560 embedding table (0.72 GiB bf16) never
# occupies HBM. Exact.
krea2_text_embed_on_host: False
# Transformer block matmul quantization: '' (off) or 'w8a8' (int8 weights, quantized on the host at
# load time with one scale per output column, and int8 activations, quantized per token inside the
# step; int8 x int8 matmuls run ~2x faster than bf16 on TPU v6e and halve the transformer's HBM).
# Image quality with quantized activations must be checked against the unquantized output.
krea2_transformer_quantization: ''
# DiT block projections that run as W8A8. Allowed: to_q, to_k, to_v, to_gate, to_out, gate_proj,
# up_proj, down_proj. to_k/to_v are small (6144 -> 1536) and stay float by default.
# Command-line override: "krea2_transformer_quant_targets=['gate_proj','up_proj','down_proj']".
krea2_transformer_quant_targets: ['to_q', 'to_gate', 'to_out', 'gate_proj', 'up_proj', 'down_proj']
# Output resolution by name instead of height/width: krea2_aspect_ratio one of 1:1 5:4 4:3 3:2 16:9 21:9
# 4:5 3:4 2:3 9:16 9:21, krea2_image_size 1k or 2k. Setting either one overrides height/width (the other
# defaults to 1:1 / 1k). Quote the ratio in YAML: unquoted 16:9 is the integer 969.
krea2_aspect_ratio: ''
krea2_image_size: ''
# Precompile mode: compile these resolutions into aot_cache_dir and exit without generating. Comma-separated
# entries: all, a size (2k), or size@ratio (2k@16:9). One transformer executable per distinct token count and
# text bucket, one VAE executable per resolution. krea2_precompile_text_tokens lists the text buckets to
# compile (rounded up to krea2_text_compaction_multiple, clipped to max_sequence_length). Precompile uses a
# fixed short prompt and no negative prompt, so the configured prompts do not change the buckets.
krea2_precompile: ''
krea2_precompile_text_tokens: [128]

# VAE (Qwen-Image / Wan 2.1 architecture) mesh + sharding.
# vae_spatial = -1 shards VAE spatial activations across all devices.
vae_spatial: -1
vae_logical_axis_rules: [
                          ['activation_batch', 'redundant'],
                          ['activation_length', 'vae_spatial'],
                          ['activation_heads', null],
                          ['activation_kv_length', null],
                          ['embed', null],
                          ['heads', null],
                          ['norm', null],
                          ['conv_batch', 'redundant'],
                          ['out_channels', 'vae_spatial'],
                          ['conv_out', 'vae_spatial'],
                          ['conv_in', 'vae_spatial'],
                        ]

# Note: Architecture dimensions are automatically read from
# pretrained_model_name_or_path (transformer/config.json, text_encoder/config.json).
# NOTE: the splash-based kernels (flash, ulysses, ulysses_ring, tokamax_flash,
# tokamax_ring) build per-batch segment ids from the text padding mask, so one
# batch may mix prompts of different token lengths. The *_custom kernels reject
# an attention_mask outright.
